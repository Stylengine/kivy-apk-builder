name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libncurses5 libstdc++6 openjdk-17-jdk unzip zlib1g-dev libffi-dev libssl-dev autoconf autotools-dev libtool pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython>=0.29.33,<3.0.0" virtualenv

    - name: Initialize Buildozer Config
      run: |
        yes | buildozer init

    - name: Configure buildozer.spec parameters
      run: |
        # Reset and rewrite target architecture configurations
        sed -i 's/^#\? \?android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.minapi =.*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25c/' buildozer.spec
        sed -i 's/^#\? \?requirements =.*/requirements = python3,kivy/' buildozer.spec

    - name: Build Android APK
      run: |
        yes | buildozer -v android debug

    - name: Check Output Workspace Directory
      run: |
        echo "=== Listing files in output directory ==="
        ls -la bin/ || echo "bin folder is totally empty!"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
